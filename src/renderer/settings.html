<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <style>
      :root {
        --bg: #14141b;
        --bg-raised: #1e1e28;
        --border: #2c2c3a;
        --text: #e8e8f0;
        --text-dim: #9a9ab0;
        --accent: #e8913a;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      #titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 36px;
        padding: 0 10px 0 14px;
        background: var(--bg-raised);
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
        user-select: none;
        -webkit-user-select: none;
      }
      #titlebar .title {
        font-weight: 600;
        color: var(--text-dim);
      }
      #close {
        -webkit-app-region: no-drag;
        border: 0;
        background: transparent;
        color: var(--text-dim);
        width: 28px;
        height: 28px;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
      }
      #close:hover {
        background: #c0392b;
        color: #fff;
      }
      main {
        padding: 18px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      .hint {
        color: var(--text-dim);
        font-size: 12px;
        margin-bottom: 14px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 16px;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        margin: 0;
      }
      dt {
        color: var(--text-dim);
        font-weight: 600;
      }
      dd {
        margin: 0;
        font-family: ui-monospace, Consolas, monospace;
        color: var(--accent);
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="titlebar">
      <span class="title">Desktop Buddy — Settings</span>
      <button id="close" title="Close">✕</button>
    </div>
    <main>
      <h1>Current settings</h1>
      <p class="hint">Read-only for now — the full settings UI lands in Wave 2.</p>
      <dl id="values"></dl>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
